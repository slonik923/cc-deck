<header class="hdr">
<div class="wrap hdr-in">
<div class="brand">
<span class="brand-mark"><svg class="i" aria-hidden="true"><use href="#i-peak"></use></svg><span class="brand-badge" id="needBadge" hidden></span></span>

</div>
<span class="live" id="live" data-on="on" role="status"><span class="live-dot"></span><span id="liveText">Connecting</span><span class="live-text-long muted" id="liveSub"></span></span>

<label class="search"><span class="sr">Filter sessions</span><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg><input id="q" type="search" placeholder="Filter by title, project or branch" autocomplete="off"><span class="kbd" aria-hidden="true">/</span></label>

</div>
</div>
</header>
<div class="ctlines" id="ct" role="img" aria-label="Session contours"><svg id="ctSvg" viewBox="0 0 1440 64" preserveAspectRatio="none" focusable="false" aria-hidden="true"></svg></div>

<main class="wrap" id="main"></main>
<div id="drawerHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
"use strict";
const TOKEN = "__CC_TOKEN__";
const PAGE_VERSION = "__CC_VERSION__";
const SVGNS = "http://www.w3.org/2000/svg";

// ---- states and groups, as in the design ----
// Groups say what you have to do: answer Claude, fix a PR, take your turn, or nothing
// (Claude, CI or reviewers are on it), or nothing for now (set aside). Keys reuse the design's colours.
const ST = {
  perm: { l: "Permission needed", i: "lock", g: "need", d: "A tool call is waiting for your approval" },
  question: { l: "Question for you", i: "question", g: "need", d: "Claude asked you something" },
  plan: { l: "Plan to approve", i: "plan", g: "need", d: "Plan mode finished; approve or edit it" },
  decision: { l: "Decision needed", i: "decision", g: "need", d: "Claude laid out options to choose from" },
  error: { l: "Error", i: "error", g: "need", d: "An API or tool error stopped the session" },
  cifail: { l: "CI failing", i: "x-circle", g: "pr", d: "A check failed on the session's PR" },
  changes: { l: "Changes requested", i: "changes", g: "pr", d: "A reviewer asked for changes" },
  conflict: { l: "PR has conflicts", i: "conflict", g: "pr", d: "The branch cannot merge cleanly" },
  approved: { l: "PR approved, merge it", i: "check", g: "turn", d: "Approved and green; it's yours to merge" },
  draft: { l: "Draft PR, review it", i: "draft", g: "turn", d: "Look over the draft, then mark it ready" },
  finished: { l: "Finished, your turn", i: "reply", g: "turn", d: "Claude ended its turn" },
  quiet: { l: "Quiet, interrupted?", i: "moon", g: "turn", d: "Process alive but silent for 15+ min" },
  working: { l: "Working", i: "spinner", g: "work", d: "Generating or running tools" },
  cirun: { l: "CI running", i: "clock", g: "work", d: "Checks are running on its PR" },
  review: { l: "Waiting for review", i: "pr", g: "work", d: "Ready for review; waiting on reviewers" },
  parked: { l: "Parked", i: "pause", g: "closed", d: "You set it aside" },
  closed: { l: "Closed", i: "stop", g: "closed", d: "Process exited after finishing" },
  midtask: { l: "Closed mid-task", i: "slash", g: "closed", d: "Process exited while it was working" },
  merged: { l: "PR merged", i: "merge", g: "done", d: "Its PR was merged" },
  done: { l: "Done", i: "check-circle", g: "done", d: "You marked it done" },
};
const SMAP = {
  permission: "perm", question: "question", plan: "plan", decision: "decision", error: "error",
  ci_failing: "cifail", changes_requested: "changes", pr_conflict: "conflict", pr_approved: "approved", pr_draft: "draft",
  idle: "finished", quiet: "quiet", working: "working", ci_pending: "cirun", pr_review: "review",
  parked: "parked", closed_midtask: "midtask", closed: "closed", pr_merged: "merged", done: "done",
};
const GR = [
  { k: "need", l: "Needs you", i: "bell", layout: "focus", hint: "Oldest first" },
  { k: "pr", l: "PRs to fix", i: "pr", layout: "cards", hint: "Failing checks, change requests, conflicts" },
  { k: "turn", l: "Your turn", i: "reply", layout: "rows", hint: "Finished, draft PRs, approved PRs" },
  { k: "work", l: "In progress", i: "clock", layout: "rows", hint: "Claude, CI or reviewers are on it" },
  { k: "closed", l: "Set aside", i: "pause", layout: "dense", hint: "Parked, or closed in the last 24 h" },
  { k: "done", l: "Done", i: "check-circle", layout: "dense", hint: "" },
];
const OLD_AFTER = 24 * 3600;
const LINKS = {
  artifact: ["sparkle", "Artifact"], notion: ["doc", "Notion"], linear: ["issue", "Linear"],
  figma: ["pen", "Figma"], gdoc: ["doc", "Google Doc"],
};

// ---- small helpers ----
const $ = (id) => document.getElementById(id);
const ls = {
  get(k, d) { try { const v = localStorage.getItem("ccdeck." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ccdeck." + k, JSON.stringify(v)); } catch {} },
};
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function ic(name, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("class", "i" + (cls ? " " + cls : ""));
  s.setAttribute("aria-hidden", "true");
  const u = document.createElementNS(SVGNS, "use");
  u.setAttribute("href", "#i-" + name);
  s.append(u);
  return s;
}
const oneLine = (t, n = 240) => { const s = String(t || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const firstPara = (t) => String(t || "").trim().split(/\n\s*\n/)[0] || "";
const shq = (v) => "'" + String(v).replace(/'/g, "'\\''") + "'";
function agoShort(ts) {
  if (!ts) return "?";
  const d = Date.now() / 1000 - ts;
  if (d < 45) return "now";
  if (d < 3600) return Math.max(1, Math.round(d / 60)) + "m";
  if (d < 86400) return Math.round(d / 3600) + "h";
  return Math.round(d / 86400) + "d";
}
function tok(n) {
  n = n || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.dataset.on = "true";
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.dataset.on = "false"; }, 2600);
}
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast((what || "Copied") + " to the clipboard"); }
  catch { toast(text); }
}

// ---- state ----
let data = null, etag = "", lastOk = 0, failures = 0;
const ui = {
  filter: "all", showDone: ls.get("showDone", false), showOld: ls.get("showOld", false), q: "",
  menu: "", drawer: "", focus: "", hint: false, legend: false, hintOff: ls.get("hintOff", false),
};
const offline = () => !!data && failures > 0 && Date.now() - lastOk > 6000;

// ---- server ----
async function load() {
  try {
    const r = await fetch("/api/sessions", { headers: { "X-CC-Token": TOKEN, "If-None-Match": etag }, cache: "no-store" });
    if (r.status !== 304 && !r.ok) throw new Error("HTTP " + r.status);
    const wasOffline = offline();
    lastOk = Date.now(); failures = 0;
    if (r.status === 304) { if (wasOffline) render(); else renderLive(); return; }
    etag = r.headers.get("ETag") || "";
    data = await r.json();
    if (data.version && PAGE_VERSION.indexOf("__") !== 0 && data.version !== PAGE_VERSION) { location.reload(); return; }
    render();
  } catch (e) {
    failures++;
    if (data) render(); else renderLive();
  }
}
async function act(id, action, extra) {
  if (offline()) { toast("Actions are paused until the server is back"); return; }
  try {
    const r = await fetch("/api/action", {
      method: "POST", headers: { "X-CC-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ id, action }, extra || {})),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "HTTP " + r.status);
    const msgs = {
      resume: j.focused ? "Switched to its " + j.focused + " tab" : "Opening a terminal" + (j.terminal ? " (" + j.terminal + ")" : "") + "…", done: "Marked done",
      undone: "Reopened", park: "Parked", unpark: "Unparked", note: "Note saved",
      open_folder: "Opening the folder…", refresh_prs: "PR states refreshed",
    };
    toast(msgs[action] || "Done");
    etag = ""; load();
  } catch (e) { toast("Failed: " + e.message); }
}

// ---- markdown: a small renderer that builds DOM nodes (never innerHTML), for Claude's messages ----
const shortUrl = (u) => { try { const x = new URL(u); return x.host + oneLine(x.pathname, 40); } catch { return u; } };
function tail(text, n) {
  const t = String(text || "").trim();
  if (t.length <= n) return t;
  const cut = t.indexOf("\n\n", t.length - n);
  return "…\n\n" + t.slice(cut > 0 ? cut + 2 : t.length - n);
}
const INLINE = /(`+)([\s\S]+?)\1|\*\*([^*]+?)\*\*|__([^_]+?)__|~~([^~]+?)~~|\*([^*\s][^*]*?)\*|(?<![\w])_([^_\s][^_]*?)_(?![\w])|\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>()\]]+[^\s<>()\].,;:!?'"])/g;
function inline(text) {
  const out = [];
  const re = new RegExp(INLINE.source, "g"); // per call: inline() recurses for nested emphasis
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] !== undefined) out.push(h("code", {}, m[2]));
    else if (m[3] !== undefined || m[4] !== undefined) out.push(h("strong", {}, inline(m[3] ?? m[4])));
    else if (m[5] !== undefined) out.push(h("del", {}, inline(m[5])));
    else if (m[6] !== undefined || m[7] !== undefined) out.push(h("em", {}, inline(m[6] ?? m[7])));
    else if (m[8] !== undefined) out.push(h("a", { href: m[9], target: "_blank", rel: "noopener noreferrer" }, inline(m[8])));
    else if (m[10] !== undefined) out.push(h("a", { href: m[10], target: "_blank", rel: "noopener noreferrer" }, shortUrl(m[10])));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
function md(text) {
  const lines = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const listRe = /^\s*([-*+]|\d+[.)])\s+(.*)$/;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    const fence = l.match(/^\s*(```|~~~)\s*([\w+-]*)/);
    if (fence) {
      const body = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence[1])) body.push(lines[i++]);
      i++;
      out.push(h("pre", {}, h("code", { "data-lang": fence[2] || null }, body.join("\n"))));
      continue;
    }
    const hd = l.match(/^\s*(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (hd) { out.push(h("h" + Math.min(6, hd[1].length + 2), {}, inline(hd[2]))); i++; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push(h("hr")); i++; continue; }
    if (l.includes("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = cells(l); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim()) rows.push(cells(lines[i++]));

          h("dt", {}, "Model"), h("dd", {}, s.raw.model || "—"),
          h("dt", {}, "Running"), h("dd", {}, (s.run ? "Yes" : "No") + " · " + (s.raw.live_source === "hook"
            ? "reported by the session's hooks" : "guessed: no hook has reported for this session")),
          h("dt", {}, "Last activity"), h("dd", {}, new Date(s.ts * 1000).toLocaleString()))))));
  const d = host.querySelector(".drawer"); if (d) d.scrollTop = scroll;
}

// ---- interactions ----
function focusKey(key) {
  const el = document.querySelector('[data-key="' + CSS.escape(key) + '"]');
  if (el) el.focus({ preventScroll: true });
}
function editNote(s) {
  const v = prompt("Note for “" + s.title + "” (empty to clear):", s.note);
  if (v !== null) act(s.id, "note", { text: v });
}
function toggleDone() { ui.showDone = !ui.showDone; ls.set("showDone", ui.showDone); if (ui.filter === "done") ui.filter = "all"; render(); }
function toggleOld() { ui.showOld = !ui.showOld; ls.set("showOld", ui.showOld); render(); }
$("tDone").addEventListener("click", toggleDone);
$("tOld").addEventListener("click", toggleOld);
$("legendBtn").addEventListener("click", (e) => { e.stopPropagation(); ui.legend = !ui.legend; renderLegend(); });
$("q").addEventListener("input", (e) => { ui.q = e.target.value; render(); });
document.addEventListener("click", () => {
  let changed = false;
  if (ui.menu) { ui.menu = ""; changed = true; }
  if (ui.hint) { ui.hint = false; renderHint(); }
  if (ui.legend) { ui.legend = false; renderLegend(); }
  if (changed) render();
});
const sidOf = (el) => { const x = el && el.closest && el.closest("[data-sid],[data-nav]"); return x ? x.dataset.sid || x.dataset.nav : ""; };
document.addEventListener("keydown", (e) => {
  const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA");
  if (e.key === "Escape") {
    if (ui.menu) { const id = ui.menu; ui.menu = ""; render(); focusKey("m:" + id); }
    else if (ui.drawer) closeDrawer();
    else if (ui.hint || ui.legend) { ui.hint = ui.legend = false; renderHint(); renderLegend(); }
    else if (t === $("q") && ui.q) { $("q").value = ""; ui.q = ""; render(); }
    return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (ui.menu) {
    const mi = document.querySelector('[data-menu="' + CSS.escape(ui.menu) + '"] [data-hotkey="' + e.key.toLowerCase() + '"]');
    if (mi && !mi.disabled) { e.preventDefault(); mi.click(); return; }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const items = [...document.querySelectorAll('[data-menu="' + CSS.escape(ui.menu) + '"] .mi:not([disabled])')];
      const i = items.indexOf(document.activeElement);
      const n = items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length];
      if (n) { e.preventDefault(); n.focus(); }
      return;
    }
  }
  if (e.key === "/") { e.preventDefault(); $("q").focus(); return; }
  if (e.key === "j" || e.key === "k") {
    const nav = [...document.querySelectorAll("#main [data-nav]")];
    if (!nav.length) return;
    const i = nav.indexOf(document.activeElement);
    const n = nav[i < 0 ? 0 : Math.max(0, Math.min(nav.length - 1, i + (e.key === "j" ? 1 : -1)))];
    e.preventDefault(); n.focus(); n.scrollIntoView({ block: "nearest" });
    return;
  }
  const sid = sidOf(document.activeElement);
  if (!sid) return;
  if (e.key === "r") { e.preventDefault(); act(sid, "resume"); }
  else if (e.key === ".") { e.preventDefault(); ui.menu = sid; render(); focusKey("mi:" + sid + ":0"); }
});

load();
setInterval(load, 2000);
setInterval(() => { if (data) render(); else renderLive(); }, 30000);
</script>
</body>
